<!doctype html>
<html lang="en">

<head>
  <link rel="preconnect" href="https://fonts.cdnfonts.com/" crossorigin="">
  <style>
    @font-face {
      font-family: 'JetBrains Mono';
      font-style: normal;
      font-display: swap;
      font-weight: 400;
      src: local('JetBrains Mono'), url('https://fonts.cdnfonts.com/s/98875/JetBrainsMonoRegular.woff') format('woff');
    }

    body {
      font-family: 'JetBrains Mono', 'Courier New', Courier, monospace;
    }
  </style>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Frederick Parotat" />
  <meta name="description" content="Personal Photo Gallery" />
  <link rel="stylesheet" href="./src/site/index.css">
  <title>The AlpBum</title>
</head>

<body>
  <table class="header">
    <tr>
      <td colspan="2" rowspan="2" class="width-auto">
        <h1 class="title" data-loca="title"><span>The AlpBum</span></h1>
        <!-- <span class="subtitle" data-loca="subtitle">- work in progress -</span> -->
      </td>
    </tr>
  </table>
  <div id="app">
    <div id="loca"></div>
    <details id="tags-expander">
      <summary>
        <span data-loca="tags">Tags</span>
        <span id="tags-summary" class="tags-summary"></span>
      </summary>
      <div id="tags-container" class="tags-container">
      </div>
    </details>
    <details id="map-expander">
      <summary>
        <span data-loca="map">Map</span>
      </summary>
      <div id="map-container" class="map-container"></div>
    </details>
    <div id="gallery-container" class="gallery-container"></div>
    <noscript>
      <h1 data-loca="nojs">This gallery will not function when JavaScript is disabled.</h1>
    </noscript>
  </div>
  <script type="module" src="/src/site/main.ts"></script>

  <table class="footer">
    <tr>
      <td data-loca="footer">Style based on <a href="https://owickstrom.github.io/the-monospace-web/">The Monospace
          Web</a> by <a href="https://wickstrom.tech/">Oskar Wickström</a></td>
    </tr>
  </table>
</body>

</html>
